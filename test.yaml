# Experiments, Workbench and Pipelines follow OIDC groups
# nova-ai-mlflow|airflow.<namespace>.admins|developers|viewers.
# nova-ai-jupyterhub.<namespace>.admins|developers. JupyterHub has no viewers group.
# One project instance is one PlatformRole nova-ai-<component>.<namespace> and one client
# nova-ai-<component>-<namespace>. Every group of that instance binds to that role.
# Deployments follows a ClusterRole rule on serving.kserve.io.
apiVersion: auth.nova-platform.io/v1alpha1
kind: PlatformRole
metadata:
  name: nova-ai-admin
  labels:
    nova-ai.io/console: nova-ai-console
    nova-ai.io/console-persona: admin
spec:
  kubernetes:
    clusterRoleSelectors:
      - matchLabels:
          nova-ai.io/aggregate-to-admin: "true"
  oidc:
    applications:
      - nova-ai-console
---
# Contributor role. No console-persona label → normal UI (no Create project,
# no Roles/Permissions). Kubernetes rights still come from aggregation.
apiVersion: auth.nova-platform.io/v1alpha1
kind: PlatformRole
metadata:
  name: nova-ai-developer
  labels:
    nova-ai.io/console: nova-ai-console
spec:
  kubernetes:
    clusterRoleSelectors:
      - matchLabels:
          nova-ai.io/aggregate-to-developer: "true"
  oidc:
    applications:
      - nova-ai-console
---
apiVersion: auth.nova-platform.io/v1alpha1
kind: PlatformRole
metadata:
  name: nova-ai-kserve-admin
  labels:
    nova-ai.io/console: nova-ai-console
spec:
  kubernetes:
    clusterRoleSelectors:
      - matchLabels:
          nova-ai.io/aggregate-to-kserve-admin: "true"
---
apiVersion: auth.nova-platform.io/v1alpha1
kind: PlatformRole
metadata:
  name: nova-ai-kserve-developer
  labels:
    nova-ai.io/console: nova-ai-console
spec:
  kubernetes:
    clusterRoleSelectors:
      - matchLabels:
          nova-ai.io/aggregate-to-kserve-developer: "true"
---
apiVersion: auth.nova-platform.io/v1alpha1
kind: PlatformRole
metadata:
  name: nova-ai-kserve-viewer
  labels:
    nova-ai.io/console: nova-ai-console
spec:
  kubernetes:
    clusterRoleSelectors:
      - matchLabels:
          nova-ai.io/aggregate-to-kserve-viewer: "true"
---
# One OIDC client per component instance. Level groups bind to this role:
# nova-ai-mlflow.ml-team.admins, nova-ai-mlflow.ml-team.developers, nova-ai-mlflow.ml-team.viewers.
apiVersion: auth.nova-platform.io/v1alpha1
kind: PlatformRole
metadata:
  name: nova-ai-mlflow.ml-team
  labels:
    nova-ai.io/console: nova-ai-console
spec:
  oidc:
    applications:
      - nova-ai-console
---
# nova-ai-airflow.ml-team.admins, nova-ai-airflow.ml-team.developers, nova-ai-airflow.ml-team.viewers.
apiVersion: auth.nova-platform.io/v1alpha1
kind: PlatformRole
metadata:
  name: nova-ai-airflow.ml-team
  labels:
    nova-ai.io/console: nova-ai-console
spec:
  oidc:
    applications:
      - nova-ai-console
---
# nova-ai-jupyterhub.ml-team.admins, nova-ai-jupyterhub.ml-team.developers. No viewers group.
apiVersion: auth.nova-platform.io/v1alpha1
kind: PlatformRole
metadata:
  name: nova-ai-jupyterhub.ml-team
  labels:
    nova-ai.io/console: nova-ai-console
spec:
  oidc:
    applications:
      - nova-ai-console
