# nova-ai.admins is a convenience group: console admin, KServe edit in every
# project, cluster KServe edit, and the ml-team component OIDC clients.
# The bindings below it pair each ml-team group with its own role.
# JupyterHub has no viewers group.
---
apiVersion: auth.nova-platform.io/v1alpha1
kind: PlatformRoleBinding
metadata:
  name: nova-ai-admins-console
  labels:
    nova-ai.io/console: nova-ai-console
spec:
  platformRoleRef:
    name: nova-ai-admin
  subjects:
    - kind: Group
      name: nova-ai.admins
  kubernetes:
    target: Cluster
---
apiVersion: auth.nova-platform.io/v1alpha1
kind: PlatformRoleBinding
metadata:
