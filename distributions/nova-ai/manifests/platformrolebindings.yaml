# Bindings for project ml-team. Each group is paired with the roles it can hold.
# Console admin is cluster-wide. Console developer is limited to ml-team.
# KServe namespace edit/view stays in ml-team. Cluster edit and cluster view
# use target Cluster and do not grant InferenceService in other projects.
# MLflow, Airflow and JupyterHub groups share one OIDC role per component.
# JupyterHub has no viewers group.
---
apiVersion: auth.nova-platform.io/v1alpha1
kind: PlatformRoleBinding
metadata:
  name: nova-ai-console-admins
  labels:
    nova-ai.io/console: nova-ai-console
spec:
  platformRoleRef:
    name: nova-ai-admin
  subjects:
    - kind: Group
      name: nova-ai-console.admins
  kubernetes:
    target: Cluster
---
apiVersion: auth.nova-platform.io/v1alpha1
kind: PlatformRoleBinding
metadata:
  name: nova-ai-console-ml-team-developers
  labels:
    nova-ai.io/console: nova-ai-console
spec:
  platformRoleRef:
    name: nova-ai-developer
  subjects:
    - kind: Group
      name: nova-ai-console.ml-team.developers
  kubernetes:
    target: Namespaces
    namespaces:
      - ml-team
---
apiVersion: auth.nova-platform.io/v1alpha1
kind: PlatformRoleBinding
metadata:
  name: nova-ai-kserve-ml-team-admins-cluster-edit
