# Console and Deployments follow ClusterRole rules, limited by kubernetes.target.
# target: Cluster on nova-ai-admin lists every project and allows creating projects.
# target: Namespaces on nova-ai-kserve-* opens Deployments in ml-team.
# Login still needs a binding to nova-ai-admin or nova-ai-developer, because
# those roles carry the nova-ai-console OIDC application.
---
apiVersion: auth.nova-platform.io/v1alpha1
kind: PlatformRoleBinding
metadata:
  name: nova-ai-console-ml-team-admins
  labels:
    nova-ai.io/console: nova-ai-console
spec:
  platformRoleRef:
    name: nova-ai-admin
  subjects:
    - kind: Group
      name: nova-ai-console.ml-team.admins
  kubernetes:
    target: Cluster
---
apiVersion: auth.nova-platform.io/v1alpha1
kind: PlatformRoleBinding
metadata:
  name: nova-ai-console-ml-team-developers
  labels:
    nova-ai.io/console: nova-ai-console
spec:
  platformRoleRef:
    name: nova-ai-developer
  subjects:
    - kind: Group
      name: nova-ai-console.ml-team.developers
  kubernetes:
    target: Namespaces
    namespaces:
      - ml-team
---
apiVersion: auth.nova-platform.io/v1alpha1
kind: PlatformRoleBinding
metadata:
  name: nova-ai-kserve-ml-team-admins
  labels:
    nova-ai.io/console: nova-ai-console
spec:
  platformRoleRef:
    name: nova-ai-kserve-admin
  subjects:
    - kind: Group
      name: nova-ai-kserve.ml-team.admins
  kubernetes:
    target: Namespaces
    namespaces:
      - ml-team
---
apiVersion: auth.nova-platform.io/v1alpha1
kind: PlatformRoleBinding
metadata:
  name: nova-ai-kserve-ml-team-developers
  labels:
    nova-ai.io/console: nova-ai-console
spec:
  platformRoleRef:
    name: nova-ai-kserve-developer
  subjects:
    - kind: Group
      name: nova-ai-kserve.ml-team.developers
  kubernetes:
    target: Namespaces
    namespaces:
      - ml-team
---
apiVersion: auth.nova-platform.io/v1alpha1
kind: PlatformRoleBinding
metadata:
  name: nova-ai-kserve-ml-team-viewers
  labels:
    nova-ai.io/console: nova-ai-console
spec:
  platformRoleRef:
    name: nova-ai-kserve-viewer
  subjects:
    - kind: Group
      name: nova-ai-kserve.ml-team.viewers
  kubernetes:
    target: Namespaces
    namespaces:
      - ml-team
---
apiVersion: auth.nova-platform.io/v1alpha1
kind: PlatformRoleBinding
metadata:
  name: nova-ai-mlflow-ml-team
  labels:
    nova-ai.io/console: nova-ai-console
spec:
  platformRoleRef:
    name: nova-ai-mlflow.ml-team
  subjects:
    - kind: Group
      name: nova-ai-mlflow.ml-team.admins
  kubernetes:
    target: None
