# ClusterRoles aggregated by nova-ai-admin / nova-ai-developer.
# PlatformRole.kubernetes.clusterRoleSelectors only matches ClusterRole.
# Bind via PlatformRoleBinding kubernetes.target: Namespaces (developer in a
# project) or Cluster (admin creating projects).
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nova-ai-aggregate-developer
  labels:
    nova-ai.io/console: nova-ai-console
    nova-ai.io/aggregate-to-developer: "true"
rules:
  # Get the bound project namespace. Do not list: list is cluster-scoped and
  # would expose every namespace in the cluster.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
  # Namespaced quota/pod/event view in the bound project.
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nova-ai-aggregate-admin
  labels:
    nova-ai.io/console: nova-ai-console
    nova-ai.io/aggregate-to-admin: "true"
rules:
  # Create, list and manage projects (namespaces + quotas).
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["*"]
  # Manage console roles and assignments.
  - apiGroups: ["auth.nova-platform.io"]
    resources:
      - platformroles
      - platformrolebindings
      - platformroles/status
      - platformrolebindings/status
    verbs: ["*"]
  # The console reads groups, users and ClusterRoles to match the signed-in user.
  - apiGroups: ["auth.nova-platform.io"]
    resources: ["groups", "users"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["get", "list", "watch"]
---
# KServe namespaced and cluster-scoped rules are separate ClusterRoles.
# A RoleBinding cannot grant cluster-scoped resources, and a ClusterRoleBinding
# would grant InferenceService in every namespace. Pre-installed objects stay
# read-only in the console.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nova-ai-aggregate-kserve-namespace-edit
  labels:
    nova-ai.io/console: nova-ai-console
    nova-ai.io/aggregate-to-kserve-namespace-edit: "true"
rules:
  - apiGroups: ["serving.kserve.io"]
    resources:
      - inferencegraphs
      - inferenceservices
      - llminferenceserviceconfigs
      - llminferenceservices
      - localmodelnodes
      - servingruntimes
      - trainedmodels
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nova-ai-aggregate-kserve-namespace-view
  labels:
    nova-ai.io/console: nova-ai-console
    nova-ai.io/aggregate-to-kserve-namespace-view: "true"
rules:
  - apiGroups: ["serving.kserve.io"]
    resources:
      - inferencegraphs
      - inferenceservices
      - llminferenceserviceconfigs
      - llminferenceservices
      - localmodelnodes
      - servingruntimes
      - trainedmodels
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nova-ai-aggregate-kserve-cluster-view
  labels:
    nova-ai.io/console: nova-ai-console
    nova-ai.io/aggregate-to-kserve-cluster-view: "true"
rules:
  - apiGroups: ["serving.kserve.io"]
    resources:
      - clusterservingruntimes
      - clusterstoragecontainers
      - localmodelnodegroups
      - localmodelcaches
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nova-ai-aggregate-kserve-cluster-edit
  labels:
    nova-ai.io/console: nova-ai-console
    nova-ai.io/aggregate-to-kserve-cluster-edit: "true"
rules:
  - apiGroups: ["serving.kserve.io"]
    resources:
      - clusterservingruntimes
      - clusterstoragecontainers
      - localmodelnodegroups
      - localmodelcaches
    verbs: ["*"]
---
# No rules. A PlatformRole for one project OIDC client selects this so a
# namespace binding reconciles without granting Kubernetes rights.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nova-ai-aggregate-component
  labels:
    nova-ai.io/console: nova-ai-console
    nova-ai.io/aggregate-to-component: "true"
rules: []
