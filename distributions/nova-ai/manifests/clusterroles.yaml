# ClusterRoles aggregated by nova-ai-admin / nova-ai-developer.
# PlatformRole.kubernetes.clusterRoleSelectors only matches ClusterRole.
# Bind via PlatformRoleBinding kubernetes.target: Namespaces (developer in a
# project) or Cluster (admin creating projects).
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nova-ai-aggregate-developer
  labels:
    nova-ai.io/console: nova-ai-console
    nova-ai.io/aggregate-to-developer: "true"
rules:
  # Get the bound project namespace. Do not list: list is cluster-scoped and
  # would expose every namespace in the cluster.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
  # Namespaced quota/pod/event view in the bound project.
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nova-ai-aggregate-admin
  labels:
    nova-ai.io/console: nova-ai-console
    nova-ai.io/aggregate-to-admin: "true"
rules:
  # Create, list and manage projects (namespaces + quotas).
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["*"]
  # Manage console roles and assignments.
  - apiGroups: ["auth.nova-platform.io"]
    resources:
      - platformroles
      - platformrolebindings
      - platformroles/status
      - platformrolebindings/status
    verbs: ["*"]
---
# KServe is separate from console roles. nova-ai-kserve-admin may create and edit
# ClusterServingRuntime and ClusterStorageContainer. Pre-installed objects stay
# read-only in the console. A namespace binding still limits InferenceService
# writes to the listed projects.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nova-ai-aggregate-kserve-admin
  labels:
    nova-ai.io/console: nova-ai-console
    nova-ai.io/aggregate-to-kserve-admin: "true"
rules:
  - apiGroups: ["serving.kserve.io"]
    resources:
      - inferencegraphs
      - inferenceservices
      - llminferenceserviceconfigs
      - llminferenceservices
      - localmodelnodes
      - servingruntimes
      - trainedmodels
      - clusterservingruntimes
      - clusterstoragecontainers
      - localmodelnodegroups
      - localmodelcaches
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nova-ai-aggregate-kserve-developer
  labels:
    nova-ai.io/console: nova-ai-console
    nova-ai.io/aggregate-to-kserve-developer: "true"
rules:
  - apiGroups: ["serving.kserve.io"]
    resources:
      - inferencegraphs
      - inferenceservices
      - llminferenceserviceconfigs
      - llminferenceservices
      - localmodelnodes
      - servingruntimes
      - trainedmodels
    verbs: ["*"]
  - apiGroups: ["serving.kserve.io"]
    resources:
      - clusterservingruntimes
      - clusterstoragecontainers
      - localmodelnodegroups
      - localmodelcaches
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nova-ai-aggregate-kserve-viewer
  labels:
    nova-ai.io/console: nova-ai-console
    nova-ai.io/aggregate-to-kserve-viewer: "true"
rules:
  - apiGroups: ["serving.kserve.io"]
    resources:
      - inferencegraphs
      - inferenceservices
      - llminferenceserviceconfigs
      - llminferenceservices
      - localmodelnodes
      - servingruntimes
      - trainedmodels
      - clusterservingruntimes
      - clusterstoragecontainers
      - localmodelnodegroups
      - localmodelcaches
    verbs: ["get", "list", "watch"]
---
# No rules. A PlatformRole for one project OIDC client selects this so a
# namespace binding reconciles without granting Kubernetes rights.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nova-ai-aggregate-component
  labels:
    nova-ai.io/console: nova-ai-console
    nova-ai.io/aggregate-to-component: "true"
rules: []
