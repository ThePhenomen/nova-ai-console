# ClusterRoles aggregated by nova-ai-admin / nova-ai-developer / nova-ai-viewer.
# PlatformRole.kubernetes.clusterRoleSelectors only matches ClusterRole.
# Bind via PlatformRoleBinding kubernetes.target: Namespaces (developer/viewer
# in a project) or Cluster (admin creating projects).
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nova-ai-aggregate-developer
  labels:
    nova-ai.io/console: nova-ai-console
    nova-ai.io/aggregate-to-developer: "true"
rules:
  # Get the bound project namespace. Do not list: list is cluster-scoped and
  # would expose every namespace in the cluster.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
  # Namespaced quota/pod/event view in the bound project.
  - apiGroups: [""]
    resources: ["resourcequotas", "pods", "pods/status", "events"]
    verbs: ["get", "list", "watch"]
  # Namespaced KServe CRs — full access in the bound namespace.
  - apiGroups: ["serving.kserve.io"]
    resources:
      - inferencegraphs
      - inferenceservices
      - llminferenceserviceconfigs
      - llminferenceservices
      - localmodelnodes
      - servingruntimes
      - trainedmodels
    verbs: ["*"]
  # Cluster-scoped KServe CRs: view only (RoleBinding would otherwise grant
  # cluster-wide write).
  - apiGroups: ["serving.kserve.io"]
    resources:
      - clusterservingruntimes
      - clusterstoragecontainers
      - localmodelnodegroups
      - localmodelcaches
    verbs: ["get", "list", "watch"]
  # Namespaced Ray CRs — full access in the bound namespace.
  - apiGroups: ["ray.io"]
    resources:
      - rayclusters
      - rayjobs
      - rayservices
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nova-ai-aggregate-viewer
  labels:
    nova-ai.io/console: nova-ai-console
    nova-ai.io/aggregate-to-viewer: "true"
rules:
  # Same resources as developer, read-only.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["resourcequotas", "pods", "pods/status", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["serving.kserve.io"]
    resources:
      - inferencegraphs
      - inferenceservices
      - llminferenceserviceconfigs
      - llminferenceservices
      - localmodelnodes
      - servingruntimes
      - trainedmodels
      - clusterservingruntimes
      - clusterstoragecontainers
      - localmodelnodegroups
      - localmodelcaches
    verbs: ["get", "list", "watch"]
  - apiGroups: ["ray.io"]
    resources:
      - rayclusters
      - rayjobs
      - rayservices
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nova-ai-aggregate-admin
  labels:
    nova-ai.io/console: nova-ai-console
    nova-ai.io/aggregate-to-admin: "true"
rules:
  # Create, list and manage projects (namespaces + quotas).
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["*"]
  # Manage console roles and assignments.
  - apiGroups: ["auth.nova-platform.io"]
    resources:
      - platformroles
      - platformrolebindings
      - platformroles/status
      - platformrolebindings/status
    verbs: ["*"]
  # LocalModelCache is cluster-scoped in crds.yaml.
  - apiGroups: ["serving.kserve.io"]
    resources: ["localmodelcaches"]
    verbs: ["*"]
