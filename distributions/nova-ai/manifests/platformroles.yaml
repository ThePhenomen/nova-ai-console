apiVersion: auth.nova-platform.io/v1alpha1
kind: PlatformRole
metadata:
  name: nova-ai-admin
  labels:
    nova-ai.io/console: nova-ai-console
    nova-ai.io/console-persona: admin
spec:
  kubernetes:
    clusterRoleSelectors:
      - matchLabels:
          nova-ai.io/aggregate-to-developer: "true"
      - matchLabels:
          nova-ai.io/aggregate-to-admin: "true"
  oidc:
    applications:
      - nova-ai-console
---
# Contributor role. No console-persona label → normal UI (no Create project,
# no Roles/Permissions). Kubernetes rights still come from aggregation.
apiVersion: auth.nova-platform.io/v1alpha1
kind: PlatformRole
metadata:
  name: nova-ai-developer
  labels:
    nova-ai.io/console: nova-ai-console
spec:
  kubernetes:
    clusterRoleSelectors:
      - matchLabels:
          nova-ai.io/aggregate-to-developer: "true"
  oidc:
    applications:
      - nova-ai-console
---
# Experiments sidebar and project tab are gated on this service label.
# Workbench and Deployments work the same way.
apiVersion: auth.nova-platform.io/v1alpha1
kind: PlatformRole
metadata:
  name: nova-ai-mlflow
  labels:
    nova-ai.io/console: nova-ai-console
    nova-ai.io/console-service: Experiments
spec:
  oidc:
    applications:
      - nova-ai-console
---
apiVersion: auth.nova-platform.io/v1alpha1
kind: PlatformRole
metadata:
  name: nova-ai-workbench
  labels:
    nova-ai.io/console: nova-ai-console
    nova-ai.io/console-service: Workbench
spec:
  oidc:
    applications:
      - nova-ai-console
---
apiVersion: auth.nova-platform.io/v1alpha1
kind: PlatformRole
metadata:
  name: nova-ai-deployments
  labels:
    nova-ai.io/console: nova-ai-console
    nova-ai.io/console-service: Deployments
spec:
  oidc:
    applications:
      - nova-ai-console
