# Experiments, Workbench and Pipelines follow OIDC groups
# nova-ai-mlflow|airflow.<namespace>.admins|developers|viewers.
# nova-ai-jupyterhub.<namespace>.admins|developers. JupyterHub has no viewers group.
# One project instance is one PlatformRole nova-ai-<component>.<namespace> and one client
# nova-ai-<component>-<namespace>. Every group of that instance binds to that role.
# Deployments follows serving.kserve.io rules. nova-ai-kserve.<namespace>.edit
# edits namespaced objects in that project. nova-ai-kserve.<namespace>.view
# only reads them. nova-ai-kserve.cluster-edit edits the cluster-scoped KServe objects.
# nova-ai-kserve.cluster-view only reads those cluster-scoped objects.
apiVersion: auth.nova-platform.io/v1alpha1
kind: PlatformRole
metadata:
  name: nova-ai-admin
  labels:
    nova-ai.io/console: nova-ai-console
    nova-ai.io/console-persona: admin
spec:
  kubernetes:
    clusterRoleSelectors:
      - matchLabels:
          nova-ai.io/aggregate-to-admin: "true"
  oidc:
    applications:
      - nova-ai-console
---
# Contributor role. Kubernetes rights still come from aggregation.
# No namespace create and no platformroles write, so the console stays a contributor.
apiVersion: auth.nova-platform.io/v1alpha1
kind: PlatformRole
metadata:
  name: nova-ai-developer
  labels:
    nova-ai.io/console: nova-ai-console
spec:
  kubernetes:
    clusterRoleSelectors:
      - matchLabels:
          nova-ai.io/aggregate-to-developer: "true"
  oidc:
    applications:
      - nova-ai-console
---
# Cluster-scoped write. Bind with kubernetes.target Cluster. Does not include
# InferenceService, so it does not open Deployments in every project.
apiVersion: auth.nova-platform.io/v1alpha1
kind: PlatformRole
metadata:
  name: nova-ai-kserve.cluster-edit
  labels:
    nova-ai.io/console: nova-ai-console
    nova-ai.io/kubernetes-target: Cluster
spec:
  kubernetes:
    clusterRoleSelectors:
      - matchLabels:
          nova-ai.io/aggregate-to-kserve-cluster-edit: "true"
---
# Cluster-scoped read for developers and viewers. Bind with target Cluster.
# A namespace RoleBinding cannot grant these resources.
apiVersion: auth.nova-platform.io/v1alpha1
kind: PlatformRole
metadata:
  name: nova-ai-kserve.cluster-view
  labels:
    nova-ai.io/console: nova-ai-console
    nova-ai.io/kubernetes-target: Cluster
spec:
  kubernetes:
    clusterRoleSelectors:
      - matchLabels:
          nova-ai.io/aggregate-to-kserve-cluster-view: "true"
---
apiVersion: auth.nova-platform.io/v1alpha1
kind: PlatformRole
metadata:
  name: nova-ai-kserve.ml-team.edit
  labels:
    nova-ai.io/console: nova-ai-console
spec:
  kubernetes:
    clusterRoleSelectors:
      - matchLabels:
          nova-ai.io/aggregate-to-kserve-namespace-edit: "true"
---
apiVersion: auth.nova-platform.io/v1alpha1
kind: PlatformRole
metadata:
  name: nova-ai-kserve.ml-team.view
  labels:
    nova-ai.io/console: nova-ai-console
spec:
  kubernetes:
    clusterRoleSelectors:
      - matchLabels:
          nova-ai.io/aggregate-to-kserve-namespace-view: "true"
---
# One OIDC client per component instance. Level groups bind to this role:
# nova-ai-mlflow.ml-team.admins, nova-ai-mlflow.ml-team.developers, nova-ai-mlflow.ml-team.viewers.
apiVersion: auth.nova-platform.io/v1alpha1
kind: PlatformRole
metadata:
  name: nova-ai-mlflow.ml-team
  labels:
    nova-ai.io/console: nova-ai-console
spec:
  oidc:
    applications:
      - nova-ai-mlflow-ml-team
---
# nova-ai-airflow.ml-team.admins, nova-ai-airflow.ml-team.developers, nova-ai-airflow.ml-team.viewers.
apiVersion: auth.nova-platform.io/v1alpha1
kind: PlatformRole
metadata:
  name: nova-ai-airflow.ml-team
  labels:
    nova-ai.io/console: nova-ai-console
spec:
  oidc:
    applications:
      - nova-ai-airflow-ml-team
---
# nova-ai-jupyterhub.ml-team.admins, nova-ai-jupyterhub.ml-team.developers. No viewers group.
apiVersion: auth.nova-platform.io/v1alpha1
kind: PlatformRole
metadata:
  name: nova-ai-jupyterhub.ml-team
  labels:
    nova-ai.io/console: nova-ai-console
spec:
  oidc:
    applications:
      - nova-ai-jupyterhub-ml-team
