apiVersion: auth.nova-platform.io/v1alpha1
kind: PlatformRole
metadata:
  name: nova-ai-admin
  labels:
    nova-ai.io/console: nova-ai-console
    nova-ai.io/console-persona: admin
spec:
  kubernetes:
    clusterRoleSelectors:
      - matchLabels:
          nova-ai.io/aggregate-to-developer: "true"
      - matchLabels:
          nova-ai.io/aggregate-to-admin: "true"
  oidc:
    applications:
      - nova-ai-console
---
apiVersion: auth.nova-platform.io/v1alpha1
kind: PlatformRole
metadata:
  name: nova-ai-developer
  labels:
    nova-ai.io/console: nova-ai-console
    nova-ai.io/console-persona: developer
spec:
  kubernetes:
    clusterRoleSelectors:
      - matchLabels:
          nova-ai.io/aggregate-to-developer: "true"
  oidc:
    applications:
      - nova-ai-console
---
# Experiments sidebar is gated on this service label, not on nova-ai-developer.
apiVersion: auth.nova-platform.io/v1alpha1
kind: PlatformRole
metadata:
  name: nova-ai-mlflow
  labels:
    nova-ai.io/console: nova-ai-console
    nova-ai.io/console-service: mlflow
spec:
  oidc:
    applications:
      - nova-ai-console
