apiVersion: auth.nova-platform.io/v1alpha1
kind: PlatformRole
metadata:
  name: nova-ai-admin
  labels:
    nova-ai.io/console: nova-ai-console
    nova-ai.io/console-persona: admin
    nova-ai.io/experiments-enabled: "true"
    nova-ai.io/workbench-enabled: "true"
    nova-ai.io/deployments-enabled: "true"
spec:
  kubernetes:
    clusterRoleSelectors:
      - matchLabels:
          nova-ai.io/aggregate-to-developer: "true"
      - matchLabels:
          nova-ai.io/aggregate-to-admin: "true"
  oidc:
    applications:
      - nova-ai-console
---
# Contributor role. No console-persona label → normal UI (no Create project,
# no Roles/Permissions). Kubernetes rights still come from aggregation.
apiVersion: auth.nova-platform.io/v1alpha1
kind: PlatformRole
metadata:
  name: nova-ai-developer
  labels:
    nova-ai.io/console: nova-ai-console
    nova-ai.io/experiments-enabled: "true"
    nova-ai.io/workbench-enabled: "true"
spec:
  kubernetes:
    clusterRoleSelectors:
      - matchLabels:
          nova-ai.io/aggregate-to-developer: "true"
  oidc:
    applications:
      - nova-ai-console
---
# Read-only counterpart of nova-ai-developer.
apiVersion: auth.nova-platform.io/v1alpha1
kind: PlatformRole
metadata:
  name: nova-ai-viewer
  labels:
    nova-ai.io/console: nova-ai-console
    nova-ai.io/experiments-enabled: "true"
    nova-ai.io/workbench-enabled: "true"
spec:
  kubernetes:
    clusterRoleSelectors:
      - matchLabels:
          nova-ai.io/aggregate-to-viewer: "true"
  oidc:
    applications:
      - nova-ai-console
---
